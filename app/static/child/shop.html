<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>积分商店 - 积分奖励平台</title>
  <link rel="stylesheet" href="/static/css/child.css">
</head>
<body>
  <div class="navbar">
    <span class="navbar__title">🎁 积分商店</span>
    <div class="navbar__right">
      <span id="navBalance" style="font-weight:700; color:var(--brand);">0</span>
      <span style="font-size:13px; color:var(--text-muted);">积分</span>
    </div>
  </div>

  <div class="page-content">
    <div class="balance-box">
      <span class="balance-box__icon">⭐</span>
      <div>
        <div class="balance-box__value" id="balanceValue">0</div>
        <div class="balance-box__label">可用积分</div>
      </div>
    </div>

    <div id="productGrid" class="product-grid">
      <div class="empty-state">
        <div class="empty-state__icon">⏳</div>
        <div class="empty-state__text">加载中...</div>
      </div>
    </div>
  </div>

  <div class="tabbar" id="tabbar"></div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/child.js"></script>
  <script>
    let childBalance = 0;

    async function init() {
      if (!await checkChildAuth()) return;
      document.getElementById('tabbar').innerHTML = renderTabbar('shop');
      await loadBalance();
      await loadProducts();
    }

    async function loadBalance() {
      const res = await API.getBalance();
      if (res.code === 0) {
        childBalance = res.data.balance;
        document.getElementById('balanceValue').textContent = childBalance;
        document.getElementById('navBalance').textContent = childBalance;
      }
    }

    async function loadProducts() {
      const res = await API.getProducts();
      if (res.code !== 0) { showToast(res.msg); return; }
      const products = res.data || [];
      const grid = document.getElementById('productGrid');

      if (products.length === 0) {
        grid.innerHTML = `<div class="empty-state">
          <div class="empty-state__icon">🎁</div>
          <div class="empty-state__text">商店暂无商品</div>
        </div>`;
        return;
      }

      grid.innerHTML = products.map(p => {
        const soldOut = p.isSoldOut || p.stock <= 0;
        const notEnough = childBalance < p.requiredPoints;
        const imgHTML = p.imageUrl
          ? `<img src="${p.imageUrl}" alt="${p.productName}">`
          : `🎁`;
        let btnDisabled = soldOut || notEnough;
        let btnText = soldOut ? '已售罄' : (notEnough ? '积分不足' : '兑换');
        return `<div class="product-card">
          <div class="product-card__img">${imgHTML}</div>
          <div class="product-card__body">
            <div class="product-card__name">${p.productName}</div>
            <div class="product-card__cost">${p.requiredPoints} 积分</div>
            <div class="product-card__stock">库存 ${p.stock}</div>
            <button class="product-card__btn" ${btnDisabled ? 'disabled' : ''} onclick="redeem(${p.id}, '${p.productName}', ${p.requiredPoints})">${btnText}</button>
          </div>
        </div>`;
      }).join('');
    }

    function redeem(productId, name, cost) {
      const after = childBalance - cost;
      showConfirm(
        '确认兑换',
        `${name}<br>需要 ${cost} 积分<br>兑换后剩余 ${after} 积分`,
        async () => {
          const res = await API.redeemProduct(productId);
          if (res.code === 0) {
            showToast(`🎉 ${res.msg}！`);
            childBalance = res.data.currentBalance;
            document.getElementById('balanceValue').textContent = childBalance;
            document.getElementById('navBalance').textContent = childBalance;
            await loadProducts();
          } else {
            showToast(res.msg);
          }
        }
      );
    }

    init();
  </script>
</body>
</html>
