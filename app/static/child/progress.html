<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务进度 - 积分奖励平台</title>
  <link rel="stylesheet" href="/static/css/child.css">
</head>
<body>
  <div class="navbar">
    <span class="navbar__title">📊 任务进度</span>
  </div>

  <div class="page-content">
    <div class="tabs">
      <button class="tab active" data-type="daily" onclick="switchTab('daily')">📅 日常</button>
      <button class="tab" data-type="weekly" onclick="switchTab('weekly')">📆 周任务</button>
      <button class="tab" data-type="monthly" onclick="switchTab('monthly')">🗓️ 月度</button>
    </div>

    <div id="progressContent">
      <div class="empty-state">
        <div class="empty-state__icon">⏳</div>
        <div class="empty-state__text">加载中...</div>
      </div>
    </div>
  </div>

  <div class="tabbar" id="tabbar"></div>

  <script src="/static/js/api.js"></script>
  <script src="/static/js/child.js"></script>
  <script>
    let currentType = 'daily';

    async function init() {
      if (!await checkChildAuth()) return;
      document.getElementById('tabbar').innerHTML = renderTabbar('progress');
      await loadProgress();
    }

    async function loadProgress() {
      const res = await API.getTaskProgress(currentType);
      if (res.code !== 0) { showToast(res.msg); return; }

      const data = res.data;
      const rate = Math.round(data.completionRate * 100);
      const circumference = 2 * Math.PI * 34;
      const dashOffset = circumference * (1 - data.completionRate);

      let html = `
        <div class="progress-ring">
          <svg width="80" height="80">
            <circle cx="40" cy="40" r="34" fill="none" stroke="var(--brand-light)" stroke-width="6"/>
            <circle cx="40" cy="40" r="34" fill="none" stroke="var(--brand)" stroke-width="6"
              stroke-dasharray="${circumference}"
              stroke-dashoffset="${dashOffset}"
              stroke-linecap="round"
              transform="rotate(-90 40 40)"
              style="transition: stroke-dashoffset 0.5s;"/>
            <text x="40" y="46" text-anchor="middle" fill="var(--brand)" font-size="16" font-weight="700">${rate}%</text>
          </svg>
          <div>
            <div class="progress-ring__label">${taskTypeLabels[currentType]}</div>
            <div class="progress-ring__sub">已完成 ${data.completedCount}/${data.totalCount} 项任务</div>
          </div>
        </div>
      `;

      if (data.tasks.length === 0) {
        html += `<div class="empty-state">
          <div class="empty-state__icon">🎉</div>
          <div class="empty-state__text">暂无${taskTypeLabels[currentType]}</div>
        </div>`;
      } else {
        html += data.tasks.map(t => {
          const pct = t.isCompleted ? 100 : 0;
          const statusTag = t.isCompleted
            ? '<span class="tag tag--success">已完成</span>'
            : '<span class="tag tag--default">待完成</span>';
          return `<div class="task-card">
            <div class="task-card__icon">${t.icon || '⭐'}</div>
            <div class="task-card__body">
              <div class="task-card__title">${t.taskName}</div>
              <div class="progress-bar"><div class="progress-bar__fill" style="width:${pct}%"></div></div>
            </div>
            <div style="text-align:right;">
              <div class="task-card__points">+${t.rewardPoints}</div>
              ${statusTag}
            </div>
          </div>`;
        }).join('');

        if (data.completedCount === data.totalCount && data.totalCount > 0) {
          html += `<div style="text-align:center; padding:16px; color:var(--brand); font-weight:600;">
            🎉 全部完成！你太棒了！
          </div>`;
        }
      }

      document.getElementById('progressContent').innerHTML = html;
    }

    function switchTab(type) {
      currentType = type;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.tab[data-type="${type}"]`).classList.add('active');
      loadProgress();
    }

    init();
  </script>
</body>
</html>
